[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-cost-lab"
version = "0.1.0"
description = "Benchmark and toolkit that measures how much each LLM cost optimization saves at equal quality."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.scripts]
costlab = "costlab.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools]
packages = ["costlab", "costlab.graders", "costlab.strategies"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests share helpers (`from tests.test_strategies import ...`). Plain `pytest` (CI) does not put
# the project folder on sys.path the way `python -m pytest` does, so add it explicitly.
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
