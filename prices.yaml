# USD per 1 million tokens, Claude API first-party rates.
# Source: platform.claude.com/docs/en/about-claude/pricing (checked 2026-11-01).
# Re-check before any reported run; costs are recomputed from stored token
# counts, so a price change never needs a re-run.
#
# cache_write = 5-minute cache write.  cache_read = cache hit or refresh.
# Batch API: every token category costs batch_multiplier x the rates below
# (50% off, per the Message Batches docs). Applied to calls marked as batch calls.

batch_multiplier: 0.5

models:
  claude-haiku-5-5:
    input: 0.10
    output: 0.50
    cache_write: 0.125
    cache_read: 0.01
    # Prompts over 100,000 tokens are billed at higher rates on every category.
    long_context_threshold: 100000
    long:
      input: 0.50
      output: 2.50
      cache_write: 0.625
      cache_read: 0.05

  claude-sonnet-5-5:
    input: 2.00
    output: 10.00
    cache_write: 2.50
    cache_read: 0.10

  claude-opus-5-5:
    input: 4.00
    output: 20.00
    cache_write: 5.00
    cache_read: 0.20
